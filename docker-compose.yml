version: '3.8'

networks:
  stack_automacao:
    driver: bridge

services:
  # --- BANCO DE DADOS ---
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    networks:
      - stack_automacao
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- CACHE ---
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - stack_automacao
    volumes:
      - redis_data:/data


  # --- N8N ---
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_app
    user: "root"
    restart: always
    networks:
      - stack_automacao
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_DISABLE_FILESYSTEM_OPERATIONS=false
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=false
      - N8N_FILE_ACCESS_WHITELIST=/home/node/Documentos,/home/node/.n8n-files,/tmp
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node/Documentos;/home/node/.n8n-files;/tmp
    volumes:
      - n8n_data:/home/node/.n8n
      - C:/Users/Terminal/Documents/n8n_docs:/home/node/Documentos
    depends_on:
      - db
  

volumes:
  postgres_data:
  redis_data:
  n8n_data: